name: Lien Review

# Dogfoods the Lien Review action on this monorepo's own PRs.
#
# The action posts no Checks API check run of its own — this workflow job is the
# single status check. Findings surface as workflow annotations (inline on the
# diff), inline PR comments, and a step summary.
#
# The public, external-consumer path is `uses: getlien/lien-review@v1` (a Docker
# action backed by a prebuilt GHCR image — see packages/action/README.md). Both
# the image and the public dist repo are published; this monorepo still builds
# the action from source and runs its entrypoint directly on purpose, so CI
# dogfoods the current commit instead of the last released tag. Same code
# path either way, so this isn't a stand-in for the real thing.
#
# fail-on defaults to 'never' (fully advisory) for every OTHER consumer, so
# the check stays green whenever the action *runs*; findings show as
# annotations + comments only. This repo's own PRs opt into `fail-on: error`
# below (INPUT_FAIL_ON in the "Run Lien Review" step's env, as of #1070) — see
# that var's comment for why 'error' and not 'any'. One consequence worth
# knowing: because this is `pull_request` (not `pull_request_target`), a PR
# that edits this file gates itself using ITS OWN edited copy of the workflow,
# not main's — GitHub runs `pull_request` workflows from the PR's head ref.
#
# `types` is pinned explicitly rather than left as GitHub's pull_request default
# (opened/synchronize/reopened) so nobody can widen it to `edited` without
# noticing the footgun: the review engine unconditionally rewrites the PR body's
# `<!-- lien:* -->` stats section on every run (updatePRDescription() in
# packages/review/src/github-api.ts), so an `edited`-triggered rerun would
# re-edit the body, re-trigger itself, and loop indefinitely at ~one review's
# wall-clock time per cycle. `ready_for_review` is added on top of the default
# set so a draft PR marked ready without a new commit still gets reviewed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lien-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # reviewPullRequest() (packages/action -> @liendev/review) parses the
      # PR's changed files via performChunkOnlyIndex/chunkFile, which now
      # requires the native binding -- see ci.yml's build-and-test job for
      # the same steps. Without this, ADR-013 Phase 4-B's fail-fast
      # NativeBindingLoadError crashes every review run.
      - name: Cache Rust build (parser-native)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parser-native
          shared-key: parser-native

      - name: Build native parser
        run: npm run build:native -w @liendev/parser-native

      - name: Build review engine + action
        run: npm run build -w @liendev/parser -w @liendev/core -w @liendev/review -w @liendev/action

      - name: Run Lien Review
        run: node packages/action/dist/index.js
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # fail-on: 'error' — opts THIS repo's own PRs into the review's
          # severity gate. Default is 'never' (fully advisory) for every other
          # @liendev/review / @liendev/action consumer — see action.yml's
          # `fail-on` input and inputs.ts's `parseFailOn`. Motivated by #1068:
          # three live defects rode a green `review` check in a single day
          # (two fabrication bugs: #1063's `fs.existsSync` accepting
          # directories, and its `dirname($p, 2)` misresolution; a third in
          # #1069), all three caught only by findings this check reported as
          # success, because this repo had never opted out of the advisory
          # default. Two independent things can make this exit non-zero:
          # (1) a `failure` conclusion from engine.ts's `determineConclusion`
          # — a non-complexity error-severity (🔴) finding, or a complexity
          # violation the PR introduced/worsened — which is what `fail-on`
          # actually gates on, and never fires on warnings (🟡) alone; and
          # (2) index.ts's `exitCodeFor` failing unconditionally, REGARDLESS
          # of `fail-on` (including this repo's 'error'), on an operational
          # shortfall — a total LLM-provider failure (`providerFailure`) or
          # an incomplete main pass (`incompleteMainPass`) — since neither is
          # an advisory finding to gate on; there was no review to advise
          # from. Deliberately not 'any' for (1): #1063 alone produced 9
          # findings across 5 rounds, 8 of them warnings, so failing on
          # warnings too would routinely block PRs on non-blocking findings.
          INPUT_FAIL_ON: 'error'
          # Dedicated candidate-loop passes (stale-duplicate-pass.ts,
          # incomplete-handling-pass.ts) — dark/opt-in for @liendev/review
          # consumers by default; this repo's own reviews opt in here to
          # dogfood them (see docs/architecture/review-pass-architecture.md's
          # status line for the mechanism and evidence status). Both gates
          # read these env vars directly via process.env — no action.yml
          # input plumbing needed.
          LIEN_STALE_DUP_PASS: 'on'
          LIEN_INCOMPLETE_PASS: 'on'
          # docs-drift-pass.ts — same dark/opt-in mechanism as the two above;
          # this repo opts in as of 2026-07-23 to dogfood it on its own PRs.
          # Still dark/off for every other @liendev/review / @liendev/action
          # consumer. A synthetic calibration run scored 1/10 against the
          # prod default model (see the status line + docs-drift subsection
          # in docs/architecture/review-pass-architecture.md, and the
          # fixture's own assertions header) — dark mechanism proven via
          # unit tests independent of that score; this opt-in is itself the
          # real-PR evidence-gathering step, not a claim of a passed bar.
          LIEN_DOCS_DRIFT_PASS: 'on'
          # removed-exports-pass.ts — same dark/opt-in mechanism as the
          # three above; this repo opts in as of 2026-07-25 to dogfood it on
          # its own PRs. Still dark/off for every other @liendev/review /
          # @liendev/action consumer. This loop has zero real-PR firing data
          # anywhere (see docs/architecture/review-pass-architecture.md's
          # status line) — this opt-in exists to start accumulating that
          # data ahead of any consumer default-on decision, not to claim a
          # passed calibration bar.
          LIEN_REMOVED_EXPORTS_PASS: 'on'
          # LIEN_REVIEW_TOKEN_BUDGET — an absolute override for the main
          # pass's final token budget (see docs/architecture/review-pass-
          # architecture.md's budget section and applyReviewTokenBudgetOverride's
          # own doc comment, packages/review/src/defaults.ts). Motivating case
          # (PR #855): the review check failed 3 of 4 runs on a genuinely
          # large feature diff, the main pass exhausting its allocation.
          # Attestation receipts across those runs: 161,588 allocated to the
          # main pass (277,588 total across main + extra passes), yet the
          # deepest-investigation variant spent up to 475,055 tokens before
          # dying incomplete; only a shallower-investigation variant finished,
          # and only because it stayed inside the original allocation by
          # exploring less. 555,176 is ~2x that 277,588 prior effective total
          # (555,176 = 277,588 * 2), comfortably clearing the observed 475,055
          # floor with headroom for the deep path to actually finish. Quoted:
          # an unquoted six-digit scalar is still worth avoiding on principle
          # here (env values are always strings; see the 'on' quoting above
          # for the same footgun class). Raises this repo's own worst-case
          # per-run OpenRouter cost on large diffs — the owner explicitly
          # approved that trade 2026-07-25. No action.yml input either (same
          # env-only, undocumented-by-design mechanism as the flags above);
          # every other @liendev/review / @liendev/action consumer is
          # unaffected (unset there, so the diff-scaled/blast-radius-scaled
          # formula runs exactly as before).
          LIEN_REVIEW_TOKEN_BUDGET: '555176'
